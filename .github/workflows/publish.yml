name: 'Deploy to Pages'

on:
  push:
    branches: ['main']
  repository_dispatch:
    types: ['publish']
  workflow_dispatch:

permissions:
  contents: 'read'
  pages: 'write'
  id-token: 'write'

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        talk:
          - '2024_12_sfcon_gotenberg'
          - '2025_01_sfonline_fireside_chat'
          - '2025_03_sflive_gotenberg'
          - '2025_09_apiplatformcon_fun_with_flags'
          - '2026_02_webdays_fun_with_flags'
          - '2026_06_symfony_online_audit_logs'
      fail-fast: false
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
        with:
          repository: 'Jean-Beru/slides'
          token: '${{ secrets.MY_PAT }}'
      - name: 'Install pnpm'
        uses: 'pnpm/action-setup@v4'
        with:
          version: '10'
      - name: 'Use Node.js LTS'
        uses: 'actions/setup-node@v4'
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: 'Install'
        run: 'pnpm install --frozen-lockfile'
      - name: 'Build'
        run: 'pnpm exec slidev build --router-mode="hash" --base="/${{ matrix.talk }}/" --out="../../public/${{ matrix.talk }}/" ./slides/${{ matrix.talk }}/index.md'
      - name: 'Archive artifacts'
        uses: 'actions/upload-artifact@v4'
        with:
          name: '${{ matrix.talk }}'
          path: './public'
  deploy:
    needs: 'build'
    environment:
      name: 'github-pages'
      url: '${{ steps.deployment.outputs.page_url }}'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout site'
        uses: 'actions/checkout@v4'
      - name: 'Use Node.js LTS'
        uses: 'actions/setup-node@v4'
        with:
          node-version: 'lts/*'
      - name: 'Download artifacts'
        uses: 'actions/download-artifact@v4'
        with:
          path: './public'
          merge-multiple: true
      - name: 'Generate landing page'
        run: 'node ./src/build.mjs'
      - name: 'Setup Pages'
        uses: 'actions/configure-pages@v5'
      - name: 'Upload artifact'
        uses: 'actions/upload-pages-artifact@v3'
        with:
          path: './public'
      - name: 'Deploy to GitHub Pages'
        id: 'deployment'
        uses: 'actions/deploy-pages@v4'
